name: Deliver News Digests

on:
  schedule:
    # Backstop only. GitHub runs this best-effort and routinely fires it up to
    # an hour late; the on-the-hour workflow_dispatch is the primary trigger.
    # Late/duplicate ticks are safe — the run floors to its hour slot and skips
    # a slot an earlier run already covered.
    - cron: "0 * * * *"
  workflow_dispatch:        # primary trigger (external hourly dispatch) + manual

# One delivery at a time. The cron backstop and the hourly dispatch can
# otherwise overlap and evaluate different hours against the same users.
concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    # The cron fires hourly, so a run must never outlive its slot. Feed fetches
    # retry up to ~64s each on a degraded host; concurrency bounds that in
    # practice, but this is the hard stop if it doesn't.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run delivery
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m delivery.main
